name: "Build and Test"
run-name: "Build and Test"
on: 
 push:
jobs:
  build:
   name: Build & Test
   runs-on: ubuntu-latest
   steps:
     - name: Checkout
       uses: actions/checkout@v4

     - name: Set up Node.js
       uses: actions/setup-node@v4
       with:
        node-version: 22
        cache: npm

     - name: Install dependencies
       run: npm ci

     - name: Build
       run: npm run build
     
     - name: Run unit tests
       run: npm run test:ci

     - name: Upload test results
       if: always()
       uses: actions/upload-artifact@v4
       with:
        name: test-results
        path: test-results/junit.xml

     - name: Upload build output
       uses: actions/upload-artifact@v4
       with:
        name: dist
        path: dist
        
      
